<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img"><style>text{font-family:'Arial',Arial,sans-serif}.display{font-family:'Arial',Arial,sans-serif}.mono{font-family:'Courier New',monospace}.txt{fill:#F5F2EA}.muted{fill:#A5A29B}.accent{fill:#D8FF3E}.panel{fill:#181818;stroke:#343434;stroke-width:1}.in{animation:rise .8s ease 0.00s both}.fade{animation:fade .9s ease 0.15s both}.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .9s ease 0.20s both}@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes grow{from{transform:scaleY(.03)}to{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.in,.fade,.bar{animation:none!important;opacity:1!important;transform:none!important}.moving{display:none!important}}</style><rect width="100%" height="100%" rx="22" fill="#101010"/><rect x="1" y="1" width="958" height="228" rx="22" class="panel"/><circle cx="910" cy="0" r="170" fill="#D8FF3E" opacity=".05"/><g class="in"><text x="42" y="48" class="mono muted" font-size="12" letter-spacing="3">D3VI® / DEVELOPER &amp; CREATIVE TECHNOLOGIST</text><text x="40" y="119" class="display txt" font-size="52" font-weight="800">Devi Prasad Sundaray</text><text x="43" y="160" class="txt" font-size="17">I make designs people remember — and build the systems behind them.</text><text x="43" y="198" class="mono accent" font-size="12">SOFTWARE · DESIGN · 3D · REALTIME</text></g><g class="moving"><circle cx="830" cy="115" r="79" fill="none" stroke="#D8FF3E" stroke-dasharray="4 8"><animateTransform attributeName="transform" type="rotate" from="0 830 115" to="360 830 115" dur="24s" repeatCount="indefinite"/></circle></g></svg>