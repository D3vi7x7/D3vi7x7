<svg xmlns="http://www.w3.org/2000/svg" width="960" height="132" viewBox="0 0 960 132" role="img"><style>text{font-family:'Arial',Arial,sans-serif}.display{font-family:'Arial',Arial,sans-serif}.mono{font-family:'Courier New',monospace}.txt{fill:#F5F2EA}.muted{fill:#A5A29B}.accent{fill:#D8FF3E}.panel{fill:#181818;stroke:#343434;stroke-width:1}.in{animation:rise .8s ease 2.20s both}.fade{animation:fade .9s ease 2.35s both}.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .9s ease 2.40s both}@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes grow{from{transform:scaleY(.03)}to{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.in,.fade,.bar{animation:none!important;opacity:1!important;transform:none!important}.moving{display:none!important}}</style><rect width="100%" height="100%" rx="22" fill="#101010"/><rect x="1" y="1" width="958" height="130" rx="19" class="panel"/><g class="in"><text x="28" y="30" class="mono accent" font-size="10">SELECTED WORK / 02</text><text x="28" y="68" class="display txt" font-size="24" font-weight="700">More projects</text><text x="28" y="96" class="muted" font-size="13">Explore my software, graphics and creative technology experiments.</text><text x="28" y="117" class="mono muted" font-size="10">OPEN SOURCE</text><path d="M900 65h22m-8 -8 8 8 -8 8" stroke="#D8FF3E" fill="none" stroke-width="2"/></g></svg>