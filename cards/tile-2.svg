<svg xmlns="http://www.w3.org/2000/svg" width="310" height="148" viewBox="0 0 310 148" role="img"><style>text{font-family:'Arial',Arial,sans-serif}.display{font-family:'Arial',Arial,sans-serif}.mono{font-family:'Courier New',monospace}.txt{fill:#F5F2EA}.muted{fill:#A5A29B}.accent{fill:#D8FF3E}.panel{fill:#181818;stroke:#343434;stroke-width:1}.in{animation:rise .8s ease 0.90s both}.fade{animation:fade .9s ease 1.05s both}.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .9s ease 1.10s both}@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes grow{from{transform:scaleY(.03)}to{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.in,.fade,.bar{animation:none!important;opacity:1!important;transform:none!important}.moving{display:none!important}}</style><rect width="100%" height="100%" rx="22" fill="#101010"/><rect x="1" y="1" width="308" height="146" rx="18" class="panel"/><g class="in"><text x="22" y="34" class="mono muted" font-size="10">02 / WHAT I DO</text><text x="22" y="87" class="display accent" font-size="35">✳</text><text x="86" y="76" class="display txt" font-size="17" font-weight="700">DESIGN</text><text x="86" y="100" class="muted" font-size="12">Visuals &amp; experiences</text><path d="M260 118h22m-8 -8 8 8 -8 8" stroke="#D8FF3E" fill="none"/></g></svg>